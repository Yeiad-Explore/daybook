# CONSTRAINTS.md gates on every push and pull request. Same checks as `pnpm check:all` locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, tokens, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:tokens
      - run: pnpm test
      - run: pnpm build
        env:
          # Build-time only; the real values come from the deployment environment.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
      - run: pnpm check:no-dev-routes # DEV-1
      - run: pnpm audit --audit-level high # exceptions: CONSTRAINTS.md E3 (pnpm-workspace.yaml auditConfig)

  database-and-e2e:
    name: Database tests (pgTAP) and end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # supabase/config.toml reads these; Google sign-in is not exercised in CI (TEST-1 email sign-in is).
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-unused
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-unused
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Database tests
        run: pnpm test:db
      - name: App environment from the local stack
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=')"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "${PUBLISHABLE_KEY:-$ANON_KEY}" > .env.local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
